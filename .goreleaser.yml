version: 2
before:
  hooks:
    - go mod download
    - mkdir -p completions
    - go run ./cmd/calcdate completion bash > completions/calcdate.bash
    - go run ./cmd/calcdate completion zsh > completions/_calcdate
    - go run ./cmd/calcdate completion fish > completions/calcdate.fish
builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/calcdate
    ldflags:
      - -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"

archives:
  - name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    formats: [ "binary" ]

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# Homebrew cask publishing (replaces the deprecated `brews:` block; casks are
# what GoReleaser supports going forward)
homebrew_casks:
  - name: calcdate
    homepage: 'https://github.com/sgaunet/calcdate'
    description: 'Command-line utility for date calculations with intuitive expression syntax'

    # Tap repository directory (casks live in Casks/, not Formula/)
    directory: Casks

    # Command name users invoke, mapped from the artifact name.
    binaries:
      - calcdate

    # Download URL of the release artifact.
    url:
      template: 'https://github.com/sgaunet/calcdate/releases/download/{{ .Tag }}/{{ .ArtifactName }}'

    # Strip the Gatekeeper quarantine xattr so the installed binary can run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}"]
          end

    commit_author:
      name: sgaunet
      email: 1552102+sgaunet@users.noreply.github.com

    repository:
      owner: sgaunet
      name: homebrew-tools
      # Token with 'repo' scope is required for pushing to a different repository
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
