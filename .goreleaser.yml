version: 2
before:
  hooks:
    - go mod download
    - mkdir -p completions
    - go run ./cmd/calcdate completion bash > completions/calcdate.bash
    - go run ./cmd/calcdate completion zsh > completions/_calcdate
    - go run ./cmd/calcdate completion fish > completions/calcdate.fish
builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/calcdate
    ldflags:
      - -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"

archives:
  - name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    formats: [ "binary" ]

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

brews:
  - homepage: 'https://github.com/sgaunet/calcdate'
    description: 'A modern command-line utility for date calculations and operations with intuitive expression syntax'
    directory: Formula
    commit_author:
      name: sgaunet
      email: 1552102+sgaunet@users.noreply.github.com
    repository:
      owner: sgaunet
      name: homebrew-tools
      # Token with 'repo' scope is required for pushing to a different repository
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    url_template: 'https://github.com/sgaunet/calcdate/releases/download/{{ .Tag }}/{{ .ArtifactName }}'
    install: |
      bin.install "{{ .ArtifactName }}" => "calcdate"
      output = Utils.safe_popen_read(bin/"calcdate", "completion", "bash")
      (bash_completion/"calcdate").write output
      output = Utils.safe_popen_read(bin/"calcdate", "completion", "zsh")
      (zsh_completion/"_calcdate").write output
      output = Utils.safe_popen_read(bin/"calcdate", "completion", "fish")
      (fish_completion/"calcdate.fish").write output
    test: |
      system "#{bin}/calcdate", "--version"
